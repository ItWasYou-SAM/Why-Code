<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">WhyCode pipeline</title>
  <desc id="desc">GitHub history is ingested into SQLite, built into a Neo4j graph, enriched structurally and turned into decisions. Retrieval, answer API and UI are not built yet.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFDFF"/>
      <stop offset="1" stop-color="#F1F6FC"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8FB0D0"/>
    </marker>
    <marker id="arrowNext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D39A4A"/>
    </marker>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>

  <text x="36" y="42" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.2" fill="#2F7D57">BUILT</text>
  <line x1="104" y1="36" x2="1164" y2="36" stroke="#D7E5D9" stroke-width="1.5"/>

  <g font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <!-- Built lane -->
    <g>
      <rect x="36" y="62" width="196" height="72" rx="14" fill="#FFFFFF" stroke="#C9DCF0" stroke-width="1.5"/>
      <text x="134" y="94" fill="#173B5E">GitHub</text>
      <text x="134" y="118" fill="#5A7692" font-size="17" font-weight="400">history</text>

      <rect x="270" y="62" width="196" height="72" rx="14" fill="#FFFFFF" stroke="#C9DCF0" stroke-width="1.5"/>
      <text x="368" y="94" fill="#173B5E">Ingestion</text>
      <text x="368" y="118" fill="#5A7692" font-size="17" font-weight="400">+ SQLite store</text>

      <rect x="504" y="62" width="196" height="72" rx="14" fill="#FFFFFF" stroke="#C9DCF0" stroke-width="1.5"/>
      <text x="602" y="94" fill="#173B5E">Graph</text>
      <text x="602" y="118" fill="#5A7692" font-size="17" font-weight="400">builder</text>

      <rect x="738" y="62" width="196" height="72" rx="14" fill="#FFFFFF" stroke="#C9DCF0" stroke-width="1.5"/>
      <text x="836" y="94" fill="#173B5E">Structural</text>
      <text x="836" y="118" fill="#5A7692" font-size="17" font-weight="400">enricher</text>

      <rect x="972" y="62" width="192" height="72" rx="14" fill="#FFFFFF" stroke="#C9DCF0" stroke-width="1.5"/>
      <text x="1068" y="94" fill="#173B5E">Decision</text>
      <text x="1068" y="118" fill="#5A7692" font-size="17" font-weight="400">extractor</text>
    </g>

    <!-- Arrows in built lane -->
    <g stroke="#8FB0D0" stroke-width="2.2" marker-end="url(#arrow)">
      <line x1="234" y1="98" x2="266" y2="98"/>
      <line x1="468" y1="98" x2="500" y2="98"/>
      <line x1="702" y1="98" x2="734" y2="98"/>
      <line x1="936" y1="98" x2="968" y2="98"/>
    </g>

    <!-- Neo4j shared store -->
    <rect x="440" y="186" width="520" height="56" rx="14" fill="#0F2F52"/>
    <text x="700" y="212" fill="#FFFFFF" font-size="20" font-weight="700">Neo4j graph</text>
    <text x="700" y="232" fill="#C9DCF0" font-size="15" font-weight="400">shared evidence · structure · decisions</text>
    <g stroke="#8FB0D0" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <line x1="602" y1="136" x2="602" y2="182"/>
      <line x1="836" y1="136" x2="836" y2="182"/>
      <path d="M 1068 136 L 1068 168 L 940 168 L 940 182"/>
    </g>

    <!-- Next lane -->
    <text x="36" y="306" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.2" fill="#B77824">NEXT</text>
    <line x1="104" y1="300" x2="1164" y2="300" stroke="#F0DFC6" stroke-width="1.5"/>

    <g>
      <rect x="504" y="326" width="196" height="72" rx="14" fill="#FFFDF8" stroke="#D8A85C" stroke-width="1.6" stroke-dasharray="7 5"/>
      <text x="602" y="358" fill="#9A651F">GraphRAG</text>
      <text x="602" y="382" fill="#B08A55" font-size="16" font-weight="400">retrieval</text>

      <rect x="738" y="326" width="196" height="72" rx="14" fill="#FFFDF8" stroke="#D8A85C" stroke-width="1.6" stroke-dasharray="7 5"/>
      <text x="836" y="358" fill="#9A651F">Answer API</text>
      <text x="836" y="382" fill="#B08A55" font-size="16" font-weight="400">citations + refusal</text>

      <rect x="972" y="326" width="192" height="72" rx="14" fill="#FFFDF8" stroke="#D8A85C" stroke-width="1.6" stroke-dasharray="7 5"/>
      <text x="1068" y="358" fill="#9A651F">Evidence UI</text>
      <text x="1068" y="382" fill="#B08A55" font-size="16" font-weight="400">prototype only</text>
    </g>

    <g stroke="#D39A4A" stroke-width="2.2" marker-end="url(#arrowNext)">
      <line x1="700" y1="242" x2="700" y2="322"/>
      <line x1="702" y1="362" x2="734" y2="362"/>
      <line x1="936" y1="362" x2="968" y2="362"/>
    </g>
  </g>
</svg>
